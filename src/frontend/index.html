<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bainpaint</title>
<link rel="stylesheet" href="vendor/tailwind.css">
</head>
<body class="min-h-screen bg-base-200">

<header class="navbar bg-base-100 shadow-sm sticky top-0 z-10 min-h-0 py-0">
  <div class="navbar-start gap-2 px-3">
    <i data-lucide="paintbrush" class="size-5 text-primary"></i>
    <span class="font-semibold">Bainpaint</span>
  </div>
  <div class="navbar-end px-3">
    <button id="theme-toggle" class="btn btn-ghost btn-circle btn-sm" title="Toggle theme">
      <i data-lucide="sun" id="icon-sun" class="size-4 hidden"></i>
      <i data-lucide="moon" id="icon-moon" class="size-4"></i>
    </button>
  </div>
</header>

<main class="container mx-auto max-w-2xl px-6 py-10">
  <div class="card bg-base-100 shadow">
    <div class="card-body gap-3">
      <h1 class="card-title text-2xl">Bainpaint</h1>
      <p class="text-sm opacity-70">
        Greenfield skeleton: tinyjs (txiki.js backend, system webview frontend) with
        vendored Tailwind CSS, daisyUI and lucide.
      </p>

      <div id="backend-status" class="flex items-center gap-2 text-sm opacity-70">
        <span class="loading loading-spinner loading-xs"></span>
        <span id="backend-status-text">contacting backend…</span>
      </div>

      <pre id="hello-out" class="hidden rounded-lg bg-base-200 p-3 text-xs font-mono whitespace-pre-wrap"></pre>

      <div class="card-actions mt-2">
        <button id="hello" class="btn btn-primary gap-2">
          <i data-lucide="sparkles" class="size-4"></i>
          Say hello
        </button>
        <button id="quit" class="btn btn-ghost gap-2">
          <i data-lucide="power" class="size-4"></i>
          Quit
        </button>
      </div>
    </div>
  </div>
</main>

<script src="vendor/lucide.min.js"></script>
<script src="app.js"></script>
</body>
</html>
