<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bainpaint</title>
<link rel="stylesheet" href="vendor/tailwind.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* Checkerboard behind the document (transparency hint). */
  #stage {
    background-color: #808080;
    background-image:
      linear-gradient(45deg, #6a6a6a 25%, transparent 25%, transparent 75%, #6a6a6a 75%),
      linear-gradient(45deg, #6a6a6a 25%, transparent 25%, transparent 75%, #6a6a6a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  #doc-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
  .bp-drop-active { box-shadow: inset 0 0 0 4px var(--color-primary); }
  .bp-tool-btn.active { background-color: var(--color-primary); color: var(--color-primary-content); }
  .bp-swatch { padding: 0; }
</style>
</head>
<body class="bg-base-200 text-base-content">

<div id="app" class="flex flex-col h-screen w-screen">

  <!-- Options bar (context-dependent per tool) -->
  <div id="optionsbar" class="flex items-center gap-3 px-3 py-1.5 bg-base-100 border-b border-base-300 text-sm shrink-0 overflow-x-auto"></div>

  <!-- Toolbar rail + stage -->
  <div class="flex flex-1 min-h-0">
    <div id="toolbar" class="flex flex-col gap-1 p-1 bg-base-100 border-r border-base-300 shrink-0 overflow-y-auto"></div>
    <div id="stage" class="relative flex-1 overflow-hidden">
      <canvas id="doc-canvas"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <!-- Palette (bottom-left) + status bar (bottom) -->
  <div class="flex items-start justify-between gap-2 px-2 py-1.5 bg-base-100 border-t border-base-300 shrink-0">
    <div id="palette" class="shrink-0"></div>
    <div id="statusbar" class="flex items-center gap-4 text-xs px-1 py-0.5 min-w-0"></div>
  </div>

</div>

<!-- Load order IS the module graph (classic scripts on window.BP). -->
